<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>面镜 MockMirror · AI 面试教练</title>
<meta name="description" content="上传简历与目标 JD，让三种 AI 面试官陪你演练，结束后拿到可执行的复盘报告。">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <header class="mobile-bar">
    <a class="brand-mini" href="/" data-link>
      <span class="logo-mark" data-logo></span>
      <span>面镜</span>
    </a>
    <button class="icon-btn" id="menuBtn" aria-label="打开菜单"></button>
  </header>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/" data-link>
      <span class="logo-mark" data-logo></span>
      <span class="brand-text">
        <strong>面镜</strong>
        <small>MockMirror</small>
      </span>
    </a>

    <nav class="nav" aria-label="主导航">
      <a class="nav-item" href="/" data-link data-nav="home"><span class="nav-ico" data-icon="home"></span><span>工作台</span></a>
      <a class="nav-item" href="/start" data-link data-nav="start"><span class="nav-ico" data-icon="sparkles"></span><span>开始面试</span></a>
      <a class="nav-item" href="/history" data-link data-nav="history"><span class="nav-ico" data-icon="history"></span><span>面试记录</span></a>
      <a class="nav-item" href="/bank" data-link data-nav="bank"><span class="nav-ico" data-icon="library"></span><span>个人题库</span><em class="nav-count" id="navBankCount"></em></a>
      <a class="nav-item" href="/knowledge" data-link data-nav="knowledge"><span class="nav-ico" data-icon="book"></span><span>知识库</span></a>
    </nav>

    <div class="sidebar-foot">
      <a class="mode-card" href="/settings" data-link>
        <span class="mode-dot" id="modeDot"></span>
        <span class="mode-text">
          <strong id="modeTitle">本地规则引擎</strong>
          <small id="modeSub">未配置模型 · 点击设置</small>
        </span>
        <span class="nav-ico" data-icon="settings"></span>
      </a>
      <div class="side-user" id="sideUser" hidden>
        <span class="side-avatar" id="sideAvatar">我</span>
        <div><strong id="sideName">我的账号</strong><small id="sideEmail"></small></div>
      </div>
      <button class="side-logout" id="logoutBtn" hidden>退出登录</button>
      <div class="side-note">
        <span>v1.1 · 个人项目</span>
        <a href="/settings" data-link>设置</a>
      </div>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main" id="view" tabindex="-1">
    <div class="page-loading"><span class="spinner"></span></div>
  </main>
</div>

<div class="toast-root" id="toastRoot" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
